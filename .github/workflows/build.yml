name: 🚀 بناء التطبيقات (APK + EXE)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # يدوي

jobs:
  # ============================================
  # بناء تطبيق ويندوز (EXE)
  # ============================================
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v4

      - name: 🔧 تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 تثبيت الاعتماديات
        run: |
          cd electron
          npm install

      - name: 🏗️ بناء التطبيق
        run: |
          cd electron
          npm run build

      - name: 📤 رفع الملفات
        uses: actions/upload-artifact@v4
        with:
          name: file-transfer-windows
          path: electron/dist-exe/*.exe

  # ============================================
  # بناء تطبيق أندرويد (APK)
  # ============================================
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v4

      - name: 🔧 تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔧 تثبيت Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 تثبيت الاعتماديات
        run: |
          cd android
          npm install
          npx cordova prepare

      - name: 🏗️ بناء التطبيق (APK)
        run: |
          cd android
          npx cordova build android --release

      - name: 📤 رفع الملفات
        uses: actions/upload-artifact@v4
        with:
          name: file-transfer-android
          path: android/platforms/android/app/build/outputs/apk/release/*.apk

  # ============================================
  # بناء كلاهما في ملف واحد مضغوط
  # ============================================
  package:
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    
    steps:
      - name: 📥 تحميل الملفات
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 📦 ضغط الملفات
        run: |
          mkdir release
          cp -r dist/file-transfer-windows/*.exe release/
          cp -r dist/file-transfer-android/*.apk release/
          zip -r file-transfer-app.zip release/*

      - name: 📤 رفع الحزمة
        uses: actions/upload-artifact@v4
        with:
          name: file-transfer-app
          path: file-transfer-app.zip

      - name: 📤 إنشاء Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: file-transfer-app.zip
          tag_name: v1.0.0
          name: "نسخة 1.0.0"
          body: |
            ## 🎉 ناقل الملفات P2P
            
            ### 📱 التطبيقات المتوفرة:
            - **Windows (EXE)** - تشغيل مباشر
            - **Android (APK)** - تثبيت على الهاتف
            
            ### ✨ المميزات:
            - نقل الملفات عبر الواي فاي بدون إنترنت
            - يعمل بين الهاتف والكمبيوتر
            - واجهة عربية بسيطة
            - سرعة عالية (P2P)
